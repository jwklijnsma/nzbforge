name: Automatic Release

# Every push to main is tested, then released automatically when it contains
# something worth releasing. The version is derived from the commit messages
# since the last v* tag (Conventional Commits):
#   feat!: / fix!: / "BREAKING CHANGE"      -> major
#   feat: ...                               -> minor
#   anything else (fix:, plain messages)    -> patch
#   only chore/ci/docs/test/style/build     -> no release (e.g. Renovate merges)
# Run it manually (Actions -> Automatic Release -> Run workflow) to force a bump.
# Pushing a v1.2.3 tag yourself also produces a release for that tag.

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [patch, minor, major]
        default: patch

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/tests.yml

  version:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.next.outputs.tag }}
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Work out next version
        id: next
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          FORCED: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" = tag ]; then
            echo "tag=$REF_NAME" >> "$GITHUB_OUTPUT"
            echo "version=${REF_NAME#v}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          last=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          if [ -z "$last" ]; then
            range=HEAD; base=0.0.0
          else
            range="$last..HEAD"; base=${last#v}
            if [ -z "$(git rev-list "$range")" ]; then
              echo "No commits since $last, nothing to release."; exit 0
            fi
          fi

          bump=""
          if [ "$EVENT" = workflow_dispatch ]; then
            bump=$FORCED
          else
            subjects=$(git log --no-merges --format=%s "$range")
            bodies=$(git log --no-merges --format=%b "$range")
            if grep -qE '^[a-z]+(\([^)]*\))?!:' <<<"$subjects" || grep -q 'BREAKING CHANGE' <<<"$bodies"; then
              bump=major
            elif grep -qE '^feat(\([^)]*\))?:' <<<"$subjects"; then
              bump=minor
            elif grep -qvE '^(chore|ci|docs|test|style|build)(\([^)]*\))?:' <<<"$subjects"; then
              bump=patch
            fi
          fi
          if [ -z "$bump" ]; then
            echo "Only chore/ci/docs/test changes since ${last:-the start}, no release."; exit 0
          fi

          IFS=. read -r major minor patch <<<"$base"
          case $bump in
            major) major=$((major+1)); minor=0; patch=0 ;;
            minor) minor=$((minor+1)); patch=0 ;;
            patch) patch=$((patch+1)) ;;
          esac
          [ -z "$last" ] && [ "$bump" = patch ] && { major=0; minor=1; patch=0; }  # first release: v0.1.0
          version="$major.$minor.$patch"
          echo "Releasing v$version ($bump bump from ${last:-nothing})"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  release:
    needs: version
    if: needs.version.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create tag and GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.version.outputs.tag }}
          generate_release_notes: true
          make_latest: true
          prerelease: ${{ contains(needs.version.outputs.tag, '-') }}

  # A tag created with GITHUB_TOKEN doesn't trigger other workflows,
  # so the versioned Docker image is built from here.
  docker:
    needs: [version, release]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-image.yml
    with:
      version: ${{ needs.version.outputs.version }}
